name: CI

on: [push, pull_request]

env:
  GCC_FLAGS: "-g -Wall -Wextra -Werror -Wno-error=maybe-uninitialized -pedantic -std=f2023 -Wimplicit-interface -fcheck=all -ffree-line-length-none -fbacktrace -finit-real=snan -ffpe-trap=invalid,zero,overflow,underflow,denormal"
  # GFortran 15 flags: same as GCC_FLAGS but without -Werror/-Wno-error=maybe-uninitialized
  # due to false-positive -Wmaybe-recursive warnings (GCC bug, no -Wno-error=maybe-recursive exists)
  GCC_15_FLAGS: "-g -Wall -Wextra -pedantic -std=f2023 -Wimplicit-interface -fcheck=all -ffree-line-length-none -fbacktrace -finit-real=snan -ffpe-trap=invalid,zero,overflow,underflow,denormal"

jobs:
  Build-Nix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: {compiler: gcc, version: '13'}
          - os: ubuntu-latest
            toolchain: {compiler: gcc, version: '14'}
          - os: ubuntu-latest
            toolchain: {compiler: gcc, version: '15'}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - uses: fortran-lang/setup-fortran@660cfc0046068d9588cec846f94cbc00118cc613 # main @ 660cfc0
      id: setup-fortran
      with:
        compiler: ${{ matrix.toolchain.compiler }}
        version: ${{ matrix.toolchain.version }}

    - uses: fortran-lang/setup-fpm@v9
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fpm-version: latest

    - name: Debug and fix assembler for GCC 15
      if: matrix.toolchain.version == '15' && contains(matrix.os || '', 'ubuntu')
      run: |
        which as
        as --version | head -1

        GFORTRAN_PATH=$(which gfortran)
        GFORTRAN_VERSION=$(gfortran --version 2>&1 | head -1)
        echo "Detected gfortran: $GFORTRAN_PATH ($GFORTRAN_VERSION)"

        # Skip if gfortran is not installed via Linuxbrew
        if ! (echo "$GFORTRAN_VERSION" | grep -qi "brew"); then
          echo "gfortran not installed via Linuxbrew (path: $GFORTRAN_PATH); skipping binutils setup."
          exit 0
        fi
        echo "Linuxbrew gfortran detected: $GFORTRAN_PATH"

        # Derive brew prefix from gfortran path (e.g. /home/linuxbrew/.linuxbrew/bin/gfortran-15 -> /home/linuxbrew/.linuxbrew)
        BREW_PREFIX=$(echo "$GFORTRAN_PATH" | sed 's|/bin/gfortran.*||')
        BREW_BIN="$BREW_PREFIX/bin/brew"

        # Ensure brew is on PATH
        ! command -v brew &>/dev/null && eval "$($BREW_BIN shellenv)" || echo "::error::brew not found at $BREW_BIN; cannot configure binutils."

        BINUTILS_BIN=$(brew --prefix binutils)/bin

        echo "$BINUTILS_BIN" >> $GITHUB_PATH
        export PATH="$BINUTILS_BIN:$PATH"
        echo "Added Linuxbrew binutils to PATH: $BINUTILS_BIN ($(as --version | head -1))"

    - name: FPM info
      run: |
        fpm --version
        which gfortran
        gfortran --version | head -1

    - name: Build
      uses: ./.github/actions/fpm-command-with-retry
      with:
        command: build
        flags: ${{ matrix.toolchain.version == '15' && env.GCC_15_FLAGS || env.GCC_FLAGS }}

    - name: Test
      uses: ./.github/actions/fpm-command-with-retry
      with:
        command: test
        flags: ${{ matrix.toolchain.version == '15' && env.GCC_15_FLAGS || env.GCC_FLAGS }}

  Build-Windows:
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        toolchain:
          - {compiler: gcc, version: '14'}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - uses: fortran-lang/setup-fortran@660cfc0046068d9588cec846f94cbc00118cc613 # main @ 660cfc0
      id: setup-fortran
      with:
        compiler: ${{ matrix.toolchain.compiler }}
        version: ${{ matrix.toolchain.version }}

    - uses: fortran-lang/setup-fpm@v9
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fpm-version: latest

    - name: Install msys2
      uses: msys2/setup-msys2@v2
      with:
        update: false
        path-type: inherit

    - name: Build Windows
      uses: ./.github/actions/fpm-command-with-retry
      with:
        command: build
        flags: ${{ env.GCC_FLAGS }}

    - name: Test Windows
      uses: ./.github/actions/fpm-command-with-retry
      with:
        command: test
        flags: ${{ env.GCC_FLAGS }}
